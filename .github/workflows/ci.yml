# Ascent CI — Ascent dogfooding its own rigor (D2/D3): lint, typecheck, unit tests, and build on
# every PR and on pushes to the default branch.
name: CI
on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # `npm run verify` (lint → typecheck → test:coverage → build) mirrors this blocking set — the
      # pre-push gate (.githooks/pre-push) and this job must change together. Coverage runs the same
      # vitest suite as "Unit tests" below, so verify covers both steps without running it twice.
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Coverage gate (calibrated floors on src/lib/db, src/components/launch, src/components/onboarding)
        run: npm run test:coverage
      - name: Build
        run: npm run build
