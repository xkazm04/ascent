# Smoke - runs the @smoke-tagged e2e subset (read-only, no scans, no auth) against any live
# instance, started by hand with workflow_dispatch. The hosted Vercel deployment was retired on
# 2026-10-24 (ascent runs locally only), so nothing triggers this on a deployment any more.
name: Smoke
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to smoke-test"
        required: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Smoke (@smoke against the given URL)
        env:
          E2E_BASE_URL: ${{ inputs.url }}
        run: npx playwright test --config playwright.config.ts --grep @smoke
