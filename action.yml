# Ascent maturity gate — a publishable GitHub Action that fails a PR/build when a repo is below
# the AI-native maturity bar. It calls your Ascent deployment's GET /api/gate endpoint (which
# already returns 200 pass / 422 fail) and turns that into a clean CI status.
#
# Usage (in a consumer repo's workflow):
#
#   - uses: <owner>/ascent@v1
#     with:
#       ascent-url: ${{ vars.ASCENT_URL }}   # e.g. https://ascent.yourco.dev
#       min-level: L3
#       min-d2: '50'                         # optional per-dimension floor (D1..D8; D9 is min-security)
#       no-ungoverned: 'true'
#
# `repo` defaults to the workflow's own repository. Combine with the PR Check + comment posted by
# the Ascent GitHub App for inline feedback; this action is the hard merge gate.
#
# PRIVATE REPOSITORIES ARE NOT GATED BY THIS ACTION. /api/gate is unauthenticated by design (CI calls
# it with plain curl) and therefore never ingests a repo with an operator token — a private repo is
# not publicly readable and the endpoint answers 404, which this action reports as an ERROR exit
# (never a false "below the bar" failure). Gate a private repo with the Ascent GitHub App's CHECK RUN
# instead: install the App on the repository and require its check in your branch-protection rules.
name: "Ascent maturity gate"
description: "Fail CI when a repository is below the AI-native maturity bar (scored by Ascent). The security floor (min-security) gates a fully deterministic signal — an LLM cannot move it."
branding:
  icon: "trending-up"
  color: "green"
inputs:
  ascent-url:
    description: "Base URL of your Ascent deployment (serves /api/gate)."
    required: true
  repo:
    description: "owner/repo to gate (defaults to the current repository)."
    required: false
    default: ""
  ref:
    description: "Git ref to gate — branch, tag, or commit SHA. On a pull_request, set this to the PR head SHA to score what the PR changes (e.g. ${{ github.event.pull_request.head.sha }})."
    required: false
    default: ""
  min-level:
    description: "Minimum overall maturity level, e.g. L3."
    required: false
    default: ""
  min-overall:
    description: "Minimum overall score (0..100)."
    required: false
    default: ""
  min-dimension:
    description: "No single dimension may score below this."
    required: false
    default: ""
  min-security:
    description: "Minimum Security (D9) dimension score — the security gate floor."
    required: false
    default: ""
  min-d1:
    description: "Minimum D1 (AI Tooling & Conventions) dimension score. Tightens, never relaxes, a floor your org's gate policy already sets."
    required: false
    default: ""
  min-d2:
    description: "Minimum D2 (Automated Testing) dimension score. Tightens, never relaxes, a floor your org's gate policy already sets."
    required: false
    default: ""
  min-d3:
    description: "Minimum D3 (CI/CD & Delivery) dimension score. Tightens, never relaxes, a floor your org's gate policy already sets."
    required: false
    default: ""
  min-d4:
    description: "Minimum D4 (Agentic Workflows) dimension score. Tightens, never relaxes, a floor your org's gate policy already sets."
    required: false
    default: ""
  min-d5:
    description: "Minimum D5 (Documentation & Knowledge) dimension score. Tightens, never relaxes, a floor your org's gate policy already sets."
    required: false
    default: ""
  min-d6:
    description: "Minimum D6 (Code Quality & Guardrails) dimension score. Tightens, never relaxes, a floor your org's gate policy already sets."
    required: false
    default: ""
  min-d7:
    description: "Minimum D7 (Commit & Velocity Signals) dimension score. Tightens, never relaxes, a floor your org's gate policy already sets."
    required: false
    default: ""
  min-d8:
    description: "Minimum D8 (AI Process & Harness) dimension score. Tightens, never relaxes, a floor your org's gate policy already sets."
    required: false
    default: ""
  no-ungoverned:
    description: "Fail if the posture is 'ungoverned' (heavy AI, light guardrails)."
    required: false
    default: "false"
  require-protection:
    description: "Fail if the default branch has no branch-protection rules (when readable)."
    required: false
    default: "false"
  min-ai-governed:
    description: "Minimum % of AI-attributed merged PRs that carried an approving human review (100 = every one). SKIPPED when unmeasurable — no token, or fewer than 5 AI-attributed PRs in the window."
    required: false
    default: ""
  no-ungoverned-ai:
    description: "Shorthand for min-ai-governed: 100 — fail if any AI-attributed PR merged without a human approval."
    required: false
    default: "false"
  live:
    description: "Score with the configured LLM instead of the deterministic mock."
    required: false
    default: "false"
# Outputs let a workflow DO something with the verdict instead of only reacting to the exit code —
# post its own comment, set a label, record the score, or branch on WHY the gate did not run. They are
# written on every exit path, including the error ones, so `status` always says what happened.
# NOTE: a failing gate fails this step, so read the outputs under `continue-on-error: true` (or
# `if: always()`) when you want the workflow to keep going and handle the verdict itself.
outputs:
  status:
    description: "pass | fail | degraded | not-found | rate-limited | error — the single value worth branching on."
    value: ${{ steps.gate.outputs.status }}
  pass:
    description: "'true' only when the repo cleared the bar (a degraded or errored run is never 'true')."
    value: ${{ steps.gate.outputs.pass }}
  degraded:
    description: "'true' when the AI grade could not be produced and the verdict is NOT authoritative."
    value: ${{ steps.gate.outputs.degraded }}
  level:
    description: "Maturity level of the scored ref, e.g. L3 (empty when nothing was scored)."
    value: ${{ steps.gate.outputs.level }}
  overall:
    description: "Overall score 0..100 (empty when nothing was scored)."
    value: ${{ steps.gate.outputs.overall }}
  posture:
    description: "Posture id of the scored ref, e.g. governed (empty when nothing was scored)."
    value: ${{ steps.gate.outputs.posture }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    # SECURITY: EVERY input reaches the script through `env:`, never through `${{ }}` interpolation in
    # the `run:` body. GitHub expands `${{ }}` into the shell script TEXT before bash ever sees it, so
    # an input carrying shell metacharacters is executed, not quoted — and a consumer workflow commonly
    # feeds these from event data (`repo: ${{ github.event.client_payload.repo }}`, a PR title, a
    # dispatch input), which is attacker-controllable. Passing them as environment variables and
    # referencing "$VAR" keeps every value inert data.
    # `id` is what makes the step's $GITHUB_OUTPUT writes addressable as steps.gate.outputs.* above.
    - id: gate
      shell: bash
      env:
        ASCENT_URL: ${{ inputs.ascent-url }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_MIN_LEVEL: ${{ inputs.min-level }}
        INPUT_MIN_OVERALL: ${{ inputs.min-overall }}
        INPUT_MIN_DIMENSION: ${{ inputs.min-dimension }}
        INPUT_MIN_SECURITY: ${{ inputs.min-security }}
        INPUT_MIN_D1: ${{ inputs.min-d1 }}
        INPUT_MIN_D2: ${{ inputs.min-d2 }}
        INPUT_MIN_D3: ${{ inputs.min-d3 }}
        INPUT_MIN_D4: ${{ inputs.min-d4 }}
        INPUT_MIN_D5: ${{ inputs.min-d5 }}
        INPUT_MIN_D6: ${{ inputs.min-d6 }}
        INPUT_MIN_D7: ${{ inputs.min-d7 }}
        INPUT_MIN_D8: ${{ inputs.min-d8 }}
        INPUT_NO_UNGOVERNED: ${{ inputs.no-ungoverned }}
        INPUT_REQUIRE_PROTECTION: ${{ inputs.require-protection }}
        INPUT_MIN_AI_GOVERNED: ${{ inputs.min-ai-governed }}
        INPUT_NO_UNGOVERNED_AI: ${{ inputs.no-ungoverned-ai }}
        INPUT_LIVE: ${{ inputs.live }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # GITHUB_REPOSITORY is the runner's own default env var — no interpolation needed.
        REPO="${INPUT_REPO:-$GITHUB_REPOSITORY}"
        ARGS=("$REPO")
        if [ -n "$INPUT_MIN_LEVEL" ]; then ARGS+=(--min-level "$INPUT_MIN_LEVEL"); fi
        if [ -n "$INPUT_MIN_OVERALL" ]; then ARGS+=(--min-overall "$INPUT_MIN_OVERALL"); fi
        if [ -n "$INPUT_MIN_DIMENSION" ]; then ARGS+=(--min-dimension "$INPUT_MIN_DIMENSION"); fi
        if [ -n "$INPUT_MIN_SECURITY" ]; then ARGS+=(--min-security "$INPUT_MIN_SECURITY"); fi
        if [ -n "$INPUT_MIN_D1" ]; then ARGS+=(--min-d1 "$INPUT_MIN_D1"); fi
        if [ -n "$INPUT_MIN_D2" ]; then ARGS+=(--min-d2 "$INPUT_MIN_D2"); fi
        if [ -n "$INPUT_MIN_D3" ]; then ARGS+=(--min-d3 "$INPUT_MIN_D3"); fi
        if [ -n "$INPUT_MIN_D4" ]; then ARGS+=(--min-d4 "$INPUT_MIN_D4"); fi
        if [ -n "$INPUT_MIN_D5" ]; then ARGS+=(--min-d5 "$INPUT_MIN_D5"); fi
        if [ -n "$INPUT_MIN_D6" ]; then ARGS+=(--min-d6 "$INPUT_MIN_D6"); fi
        if [ -n "$INPUT_MIN_D7" ]; then ARGS+=(--min-d7 "$INPUT_MIN_D7"); fi
        if [ -n "$INPUT_MIN_D8" ]; then ARGS+=(--min-d8 "$INPUT_MIN_D8"); fi
        if [ -n "$INPUT_REF" ]; then ARGS+=(--ref "$INPUT_REF"); fi
        if [ "$INPUT_NO_UNGOVERNED" = "true" ]; then ARGS+=(--no-ungoverned); fi
        if [ "$INPUT_REQUIRE_PROTECTION" = "true" ]; then ARGS+=(--require-protection); fi
        if [ -n "$INPUT_MIN_AI_GOVERNED" ]; then ARGS+=(--min-ai-governed "$INPUT_MIN_AI_GOVERNED"); fi
        if [ "$INPUT_NO_UNGOVERNED_AI" = "true" ]; then ARGS+=(--no-ungoverned-ai); fi
        if [ "$INPUT_LIVE" = "true" ]; then ARGS+=(--live); fi
        node "$ACTION_PATH/scripts/maturity-gate.mjs" "${ARGS[@]}"
